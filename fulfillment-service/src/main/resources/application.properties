spring.datasource.url=jdbc:postgresql://localhost:5432/fulfillment_service
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.port=8088

account.service.base.url=http://localhost:8088
account.service.get.customer.url=/api/v1/customers/{customerId}
account.service.get.address.url=/api/v1/customers/{customerId}/addresses/{addressId}